<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나의 건강 변화</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">시니어 맞춤 기록 보기</p>
        <h1>나의 건강 변화</h1>
        <p class="lead">선택한 기간의 기록이 이전 기간보다 늘었는지, 줄었는지, 비슷하게 유지됐는지 한눈에 봅니다.</p>
      </header>

      <section class="period-block" aria-labelledby="period-heading">
        <h2 id="period-heading">기간 선택</h2>
        <div class="period" role="group" aria-label="최근 기간">
          <button type="button" data-period="7" aria-pressed="false">7일</button>
          <button type="button" data-period="30" aria-pressed="true">30일</button>
          <button type="button" data-period="90" aria-pressed="false">90일</button>
        </div>
      </section>

      <section class="summary-block" aria-live="polite">
        <h2>최근 기록 변화 요약</h2>
        <p id="headline">기록을 불러오는 중입니다.</p>
      </section>

      <section aria-labelledby="metrics-heading">
        <h2 id="metrics-heading">핵심 지표</h2>
        <div class="cards">
          <article class="card" id="card-weight">
            <h3>체중</h3>
            <p class="value" data-role="value">—</p>
            <p class="delta" data-role="delta">—</p>
          </article>
          <article class="card" id="card-bp">
            <h3>혈압</h3>
            <p class="value" data-role="value">—</p>
            <p class="delta" data-role="delta">—</p>
          </article>
          <article class="card" id="card-steps">
            <h3>평균 걸음수</h3>
            <p class="value" data-role="value">—</p>
            <p class="delta" data-role="delta">—</p>
          </article>
          <article class="card" id="card-exercise">
            <h3>평균 운동시간</h3>
            <p class="value" data-role="value">—</p>
            <p class="delta" data-role="delta">—</p>
          </article>
        </div>
      </section>

      <section aria-labelledby="chart-heading">
        <h2 id="chart-heading">걸음수 추세</h2>
        <div class="metric-select" role="group" aria-label="그래프 지표 선택">
          <button type="button" data-metric="weight" aria-pressed="false">체중</button>
          <button type="button" data-metric="bp" aria-pressed="false">혈압</button>
          <button type="button" data-metric="steps" aria-pressed="true">걸음수</button>
          <button type="button" data-metric="exercise" aria-pressed="false">운동시간</button>
        </div>
        <div class="chart-wrap">
          <svg id="trend-chart" viewBox="0 0 384 228" role="img" aria-labelledby="chart-heading chart-desc"></svg>
          <p id="chart-legend" class="chart-legend" hidden></p>
          <p id="chart-desc" class="sr-only">선택한 기간의 하루 걸음수 추세 그래프</p>
        </div>
      </section>

      <section aria-labelledby="change-heading">
        <h2 id="change-heading">최근 변화</h2>
        <ul id="change-list"></ul>
      </section>

      <section aria-labelledby="watch-heading">
        <h2 id="watch-heading">계속 확인할 것</h2>
        <ul id="watch-list"></ul>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <footer>
      <p><strong>Demo용 Sample Data</strong> — 실제 개인 건강정보가 아닙니다. 의료 진단이나 치료 권고가 아닙니다.</p>
    </footer>

    <script src="./js/metrics.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
